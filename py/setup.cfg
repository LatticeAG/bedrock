# Compatibility metadata for setuptools < 61 (pre-PEP 621). pyproject.toml is
# the source of truth — keep these fields in sync with it.
[metadata]
name = latticeagi-bedrock
version = 0.1.0
description = Versioned signed charters, exact version pins, gateway allow/deny, advisory disputes, audit, and fleet split detection.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
packages = bedrock
python_requires = >=3.11
install_requires =
    cryptography>=41

[options.entry_points]
console_scripts =
    bedrock = bedrock.cli:_entrypoint
