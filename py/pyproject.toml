[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latticeagi-bedrock"
version = "0.1.0"
description = "Versioned signed charters, exact version pins, gateway allow/deny, advisory disputes, audit, and fleet split detection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bedrock = "bedrock.cli:_entrypoint"

[tool.setuptools]
package-dir = { "" = "." }
packages = ["bedrock"]
